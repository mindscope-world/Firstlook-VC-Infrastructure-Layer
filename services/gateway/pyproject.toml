[project]
name = "firstlook-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firstlook-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlook_gateway"]
