[project]
name = "firstlook-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firstlook-core",
    "firstlook-resolver",
    "firstlook-ai",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "temporalio>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlook_ingest"]
