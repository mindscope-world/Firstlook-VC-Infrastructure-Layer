[project]
name = "firstlook-sourcing"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firstlook-core",
    "firstlook-resolver",
    "firstlook-ingest",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlook_sourcing"]
