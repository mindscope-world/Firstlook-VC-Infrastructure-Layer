[project]
name = "firstlook-documents"
version = "0.1.0"
description = "Diligence documents: storage, parsing (PDF, PPTX, XLSX, OCR) and pages"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firstlook-core",
    "pypdf>=6.0",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlook_documents"]
