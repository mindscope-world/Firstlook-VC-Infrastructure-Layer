[project]
name = "firstlook-resolver"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firstlook-core",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "rapidfuzz>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlook_resolver"]
