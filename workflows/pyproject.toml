[project]
name = "firstlook-workflows"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firstlook-core",
    "firstlook-ingest",
    "firstlook-resolver",
    "firstlook-ai",
    "firstlook-sourcing",
    "temporalio>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlook_workflows"]
