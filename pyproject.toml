[project]
name = "firstlook-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/pycore",
    "packages/fixtures",
    "services/ingest",
    "services/resolver",
    "services/ai",
    "services/gateway",
    "workflows",
]

[tool.uv.sources]
firstlook-core = { workspace = true }
firstlook-fixtures = { workspace = true }
firstlook-ingest = { workspace = true }
firstlook-resolver = { workspace = true }
firstlook-ai = { workspace = true }
firstlook-gateway = { workspace = true }
firstlook-workflows = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.13",
    "honcho>=2.0",
    "firstlook-core",
    "firstlook-fixtures",
    "firstlook-ingest",
    "firstlook-resolver",
    "firstlook-ai",
    "firstlook-gateway",
    "firstlook-workflows",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["packages/pycore/tests", "packages/fixtures/tests", "services/ingest/tests", "services/resolver/tests", "services/ai/tests", "services/gateway/tests", "workflows/tests"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "db: needs the local Postgres (make up); skipped when unavailable",
    "integration: needs other local infrastructure",
]

[tool.ruff.lint.isort]
known-first-party = ["firstlook_core", "firstlook_fixtures", "firstlook_ingest", "firstlook_resolver", "firstlook_ai", "firstlook_gateway", "firstlook_workflows"]
