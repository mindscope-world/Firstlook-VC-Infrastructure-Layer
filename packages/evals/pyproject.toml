[project]
name = "firstlook-evals"
version = "0.1.0"
description = "Golden sets and scoring for entity resolution, LLM extraction and sourcing ranking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firstlook-core",
    "firstlook-fixtures",
    "firstlook-resolver",
    "firstlook-ai",
    "firstlook-sourcing",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "firstlook-documents",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlook_evals"]
