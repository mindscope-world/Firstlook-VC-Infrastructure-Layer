# Sourcing-ranking golden set.
#
# One thesis and a pool of invented companies, each graded by how much a
# partner at the fund would want to see it in the feed:
#   3  take the meeting this week     2  worth a look
#   1  marginal                       0  not a fit
# Profiles and signals are what the ranker would have from vendors, registries
# and news; `as_of` pins "today" so recency features are stable.

as_of: 2026-10-01

thesis:
  name: East Africa financial inclusion
  sectors: [fintech, agritech]
  stages: [pre-seed, seed]
  geographies: [east-africa]
  cheque_min_usd: 250000
  cheque_max_usd: 1000000
  founder_profile: Operators who have built distribution in informal markets; technical co-founder in place.
  description: >-
    Credit, payments and savings infrastructure for smallholder farmers, informal merchants
    and savings groups, built on mobile money.

