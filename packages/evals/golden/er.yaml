# Entity-resolution golden set.
#
# Mentions arrive in the order listed, the way the resolver sees them from
# email headers, calendar attendees, transcripts and CRM rows. `gold` names the
# real-world entity; mentions sharing a gold id are the same person/company.
# Every person and company here is invented.
#
# The traps that matter most for precision are marked "must not link": people
# who share a surname, a first initial and an email domain (siblings,
# co-founders, colleagues) and companies with near-identical names.

team:
  - [paul@savanna.vc, Paul Otieno, admin]
  - [grace@savanna.vc, Grace Wambui, associate]

