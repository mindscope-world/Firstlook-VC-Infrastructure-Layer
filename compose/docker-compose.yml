# Firstlook local stack. Everything the platform needs runs here; nothing
# depends on a cloud provider (see docs/adr/0002-local-first.md).
#
#   make dev        # core infrastructure + app processes on the host
#   make dev-full   # also Langfuse + Grafana LGTM (observability profile)
#
# Host ports use a 1xxxx range to avoid clashing with other local projects.
# Override any of them in .env.

name: firstlook

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: firstlook
      POSTGRES_PASSWORD: firstlook
      POSTGRES_DB: firstlook
    ports: ["${PG_PORT:-15432}:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstlook -d firstlook"]
      interval: 3s
      retries: 30

  redis:
    <<: *restart
    image: redis:8-alpine
    ports: ["${REDIS_PORT:-16380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # S3-compatible object storage. MinIO no longer publishes container images,
  # so we use SeaweedFS (ADR 0004). Any S3 endpoint works via S3_ENDPOINT.
  objectstore:
    <<: *restart
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports: ["${S3_PORT:-18333}:8333"]
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # Buckets created before the filer is up end up half-registered, so
    # `make up` waits for this before anything writes.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ && wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 3s
      retries: 40

  redpanda:
    <<: *restart
    image: redpandadata/redpanda:v25.2.10
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports: ["${KAFKA_PORT:-19092}:19092"]
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 30

  temporal:
    <<: *restart
    image: temporalio/temporal:1.5.1
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    ports:
      - "${TEMPORAL_PORT:-17233}:7233"
      - "${TEMPORAL_UI_PORT:-18233}:8233"
    volumes: [temporal-data:/data]

  clickhouse:
    <<: *restart
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: firstlook
      CLICKHOUSE_PASSWORD: firstlook
      CLICKHOUSE_DB: firstlook
    ports: ["${CLICKHOUSE_PORT:-18123}:8123"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  # Model router. Our gateway service (services/gateway) calls Claude through
  # the Anthropic SDK directly and uses LiteLLM for every other provider.
  litellm:
    <<: *restart
    image: ghcr.io/berriai/litellm:main-stable
    command: --config /app/config.yaml --port 4000
    env_file: [../.env]
    ports: ["${LITELLM_PORT:-14000}:4000"]
    volumes: [./litellm/config.yaml:/app/config.yaml:ro]

  # Catches outbound email (KPI chasers, digests) in development.
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.27
    ports:
      - "${SMTP_PORT:-11025}:1025"
      - "${MAILPIT_UI_PORT:-18025}:8025"

  # --- observability profile -------------------------------------------------
  langfuse:
    <<: *restart
    profiles: [observability]
    image: langfuse/langfuse:2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://firstlook:firstlook@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-13100}
      NEXTAUTH_SECRET: local-dev-only
      SALT: local-dev-only
      LANGFUSE_INIT_ORG_ID: firstlook
      LANGFUSE_INIT_PROJECT_ID: firstlook-dev
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local
      LANGFUSE_INIT_USER_EMAIL: dev@firstlook.local
      LANGFUSE_INIT_USER_PASSWORD: firstlook
    ports: ["${LANGFUSE_PORT:-13100}:3000"]

  lgtm:
    <<: *restart
    profiles: [observability]
    image: grafana/otel-lgtm:0.11.10
    ports:
      - "${GRAFANA_PORT:-13300}:3000"
      - "${OTLP_GRPC_PORT:-14317}:4317"
      - "${OTLP_HTTP_PORT:-14318}:4318"

volumes:
  pg-data:
  s3-data:
  redpanda-data:
  temporal-data:
  clickhouse-data:
