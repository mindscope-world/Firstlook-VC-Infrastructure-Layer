name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: firstlook
          POSTGRES_PASSWORD: firstlook
          POSTGRES_DB: firstlook
        ports: ["15432:5432"]
        options: --health-cmd "pg_isready -U firstlook" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Create roles and test database
        run: PGPASSWORD=firstlook psql -h localhost -p 15432 -U firstlook -d firstlook -f compose/postgres/init/00-roles.sql
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Includes the row-level security isolation suite and the end-to-end pipeline test.
      - run: uv run pytest -m "not integration"
        env: { ENV: ci }
      - run: uv run pytest -m integration workflows
        env: { ENV: ci }
      # Golden answers: entity resolution and stage-1 ranking are scored for real;
      # model-dependent suites check the harness. Live model scores: evals-live.yml.
      - name: Evals
        run: uv run python -m firstlook_evals --report evals-report.json
        env:
          ENV: ci
          DATABASE_URL: postgresql://firstlook_app:firstlook_app@localhost:15432/firstlook_test
          DATABASE_OWNER_URL: postgresql://firstlook:firstlook@localhost:15432/firstlook_test
          DATABASE_SYSTEM_URL: postgresql://firstlook_system:firstlook_system@localhost:15432/firstlook_test
          STORAGE_BACKEND: local
          STORAGE_LOCAL_ROOT: /tmp/firstlook-objects
          BUS_BACKEND: memory
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evals-golden, path: evals-report.json, if-no-files-found: ignore }

  typescript:
    runs-on: ubuntu-latest
    needs: python   # the API tests seed the database with the Python seed script
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: firstlook
          POSTGRES_PASSWORD: firstlook
          POSTGRES_DB: firstlook
        ports: ["15432:5432"]
        options: --health-cmd "pg_isready -U firstlook" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12 && uv sync --frozen
      - run: PGPASSWORD=firstlook psql -h localhost -p 15432 -U firstlook -d firstlook -f compose/postgres/init/00-roles.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @firstlook/api test
        env: { ENV: ci }
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        image: [python, api, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f infra/docker/${{ matrix.image }}.Dockerfile -t firstlook/${{ matrix.image }}:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: firstlook/${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
